interface:
  display_name: "Lithe Speaker Network Check"
  short_description: "Find evidence and safely fix speaker dropouts"
  default_prompt: "Use $diagnose-lithe-speaker-network for my real speaker issue. Ask one question per turn, run the layered first-pass tests, then give me a detailed findings overview. Inspect my router only with Read permission, explain each evidence-backed proposed change and ask permission for that exact change. Verify before and after, then finish with the problem, what was fixed and why, outstanding items, Lithe Audio Support details and a redacted customer PDF."
